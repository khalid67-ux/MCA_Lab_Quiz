
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MCA Mock Test</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>MCA Mock Test</h1>
        <p>Microprocessor and Computer Architecture</p>
        <p>SET-B | Total Questions: 20 | Full Marks: 20</p>
        <p>Time: 20 Minutes</p>
    </div>

    <div class="info">
        <span id="answered">Answered: 0/20</span>
        <span>Correct: +1 | Wrong: -0.5</span>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Questions will appear here -->
    <div id="quiz"></div>

    <button class="submit" id="submitBtn" onclick="submitQuiz()">
        SUBMIT TEST
    </button>

    <!-- Result Section -->
    <div class="result" id="result">

        <h2>Test Completed!</h2>

        <div class="score" id="finalScore"></div>

        <div class="result-grid">

            <div class="result-box">
                <h2 class="green" id="correctCount">0</h2>
                Correct
            </div>

            <div class="result-box">
                <h2 class="red" id="wrongCount">0</h2>
                Wrong
            </div>

            <div class="result-box">
                <h2 id="blankCount">0</h2>
                Unanswered
            </div>

            <div class="result-box">
                <h2 id="percentage">0%</h2>
                Accuracy
            </div>

        </div>

        <h3 id="grade"></h3>

        <button class="retake" onclick="startQuiz()">
            RETAKE QUIZ
        </button>

    </div>

</div>

<!-- External JavaScript -->
<script src="script.js"></script>

</body>
</html>
