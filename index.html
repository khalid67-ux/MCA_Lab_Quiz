
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCA Mock Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f1f5f9;
    font-family: Arial, sans-serif;
    color: #172554;
}

.container {
    max-width: 850px;
    margin: auto;
}

.header {
    background: #173b70;
    color: white;
    padding: 25px;
    border-radius: 14px;
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 10px;
}

.header p {
    margin: 5px;
    color: #dbeafe;
}

.info {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
    font-weight: bold;
}

.progress {
    height: 9px;
    background: #dbeafe;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 20px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: .3s;
}

.question {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 12px;
    border: 1px solid #dbe3ee;
    box-shadow: 0 2px 5px #00000008;
}

.question h3 {
    font-size: 16px;
    line-height: 1.6;
    margin-top: 0;
}

.code {
    background: #eef2ff;
    padding: 12px;
    border-radius: 8px;
    white-space: pre-wrap;
    font-family: monospace;
    margin-bottom: 15px;
    color: #1e40af;
}

.option {
    display: block;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #dbe3ee;
    border-radius: 8px;
    cursor: pointer;
    transition: .2s;
    line-height: 1.5;
}

.option:hover {
    background: #eff6ff;
    border-color: #2563eb;
}

.option input {
    margin-right: 9px;
}

.option.correct {
    background: #dcfce7;
    border-color: #16a34a;
}

.option.wrong {
    background: #fee2e2;
    border-color: #dc2626;
}

.explanation {
    margin-top: 12px;
    font-weight: bold;
}

button {
    padding: 14px 22px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.submit {
    width: 100%;
    background: #2563eb;
    color: white;
    margin: 15px 0;
}

.submit:hover {
    background: #1d4ed8;
}

.retake {
    width: 100%;
    background: #16a34a;
    color: white;
    margin-top: 15px;
}

.result {
    display: none;
    background: white;
    border-radius: 14px;
    padding: 25px;
    text-align: center;
    margin-top: 20px;
    border: 2px solid #bfdbfe;
}

.score {
    font-size: 42px;
    font-weight: bold;
    color: #2563eb;
    margin: 15px;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 20px;
}

.result-box {
    background: #f1f5f9;
    padding: 18px;
    border-radius: 10px;
}

.result-box h2 {
    margin: 0 0 5px;
}

.green { color: #16a34a; }
.red { color: #dc2626; }

.hidden {
    display: none;
}

@media(max-width: 500px) {
    body { padding: 10px; }
    .header { padding: 20px 10px; }
    .question { padding: 15px; }
    .info { font-size: 13px; }
}
</style>
</head>

<body>
<div class="container">

<div class="header">
    <h1>MCA Mock Test</h1>
    <p>Microprocessor and Computer Architecture</p>
    <p>SET-B | Total Questions: 20 | Full Marks: 20</p>
    <p>Time: 20 Minutes</p>
</div>

<div class="info">
    <span id="answered">Answered: 0/20</span>
    <span>Correct: +1 | Wrong: -0.5</span>
</div>

<div class="progress">
    <div class="progress-bar" id="progressBar"></div>
</div>

<div id="quiz"></div>

<button class="submit" id="submitBtn" onclick="submitQuiz()">
    SUBMIT TEST
</button>

<div class="result" id="result">
    <h2>Test Completed!</h2>
    <div class="score" id="finalScore"></div>

    <div class="result-grid">
        <div class="result-box">
            <h2 class="green" id="correctCount">0</h2>
            Correct
        </div>

        <div class="result-box">
            <h2 class="red" id="wrongCount">0</h2>
            Wrong
        </div>

        <div class="result-box">
            <h2 id="blankCount">0</h2>
            Unanswered
        </div>

        <div class="result-box">
            <h2 id="percentage">0%</h2>
            Accuracy
        </div>
    </div>

    <h3 id="grade"></h3>

    <button class="retake" onclick="startQuiz()">
        RETAKE QUIZ
    </button>
</div>

</div>

<script>

// Every question has its own correct answer.
// Q12 accepts both equivalent correct options.

const questions = [

{
q:"What is the output of the following code?",
code:"AL = -28 decimal, BL = 59 decimal\nIMUL BL\nAX = ?",
options:[
["AX = 1652H",false],
["AX = F9C8H",false],
["AX = F98CH",true],
["AX = 1652",false]
]
},

{
q:"In normal text mode, the screen is divided into:",
options:[
["80 Rows and 25 Columns",false],
["25 Rows and 80 Columns",true],
["80 Rows and 80 Columns",false],
["25 Rows and 25 Columns",false]
]
},

{
q:"If we want to divide a signed number by 2, this operation can better be accomplished by:",
options:[
["SHL",false],
["SHR",false],
["SAR",true],
["SAL",false]
]
},

{
q:"In assembly language, the CX register is used normally as a ______ register.",
options:[
["index",false],
["pointer",false],
["source",false],
["counter",true]
]
},

{
q:"What is the output of the following code?",
code:"PUSH AL",
options:[
["Increment SP by 2 & push a word to stack",false],
["Illegal",true],
["Decrement SP by 2 & push AL to stack",false],
["Decrement SP by 2 & push a word to stack",false]
]
},

{
q:"When a 32 bit number is divided by a 16 bit number, the remainder will be stored in:",
options:[
["CX",false],
["AX",false],
["DX",true],
["BX",false]
]
},

{
q:"If a common cathode 7-segment display is connected to Port A of 8255, writing 0x3F to the port will display:",
options:[
["8",false],
["9",false],
["0",true],
["1",false]
]
},

{
q:"What is the output of the following code?",
code:"CF = 0, BH = 179\nRCL BH, 1",
options:[
["CF=1, BH=01001101",false],
["CF=0, BH=00101100",false],
["CF=0, BH=01100101",false],
["CF=1, BH=01100110",true]
]
},

{
q:"______ register holds the address of next instruction to be executed.",
options:[
["Source index",false],
["Program counter",true],
["Base pointer",false],
["Code segment",false]
]
},

{
q:"To convert any digit to its ASCII representation, we need to:",
options:[
["Subtract 0x61 from the digit",false],
["Subtract 0x30 from the digit",false],
["Add 0x61 with the digit",false],
["Add 0x30 with the digit",true]
]
},

{
q:"For the execution of the instruction DIV BL, the implied dividend will be stored in:",
options:[
["DX",false],
["CX",false],
["AX",true],
["BX",false]
]
},

{
q:"What is the output of the following code?",
code:"AX = 37D7H, BH = 151 decimal\nDIV BH",
options:[
["AL = 56H, AH = 5EH",false],
["AL = 5EH, AH = 101 decimal",true],
["AL = 65H, AH = 94 decimal",false],
["AH = 65H, AL = 5EH",true]
]
},

{
q:"The instruction AND AH, 11110111 is equivalent to:",
options:[
["Sub AH, 4, if 4th bit of AH is cleared",false],
["Sub AH, 8, if 4th bit of AH is set",true],
["Sub AH, 8, if 4th bit of AH is cleared",false],
["Sub AH, 4, if 4th bit of AH is set",false]
]
},

{
q:"INT 21 service 07H is used to read character from standard input without echo. It returns the result in ______ register.",
options:[
["BH",false],
["CL",false],
["AL",true],
["BL",false]
]
},

{
q:"Suppose AL contains 20 decimal, then after two left shifts produces the value as:",
options:[
["40",false],
["5",false],
["80",true],
["10",false]
]
},

{
q:"Which flags are NOT used for mathematical operations?",
options:[
["Direction, Overflow and Trap flag",false],
["Direction, Interrupt and Trap flag",true],
["Carry, Interrupt and Trap flag",false],
["Direction, Interrupt and Sign flag",false]
]
},

{
q:"In the instruction MOV AX, 5 the number of operands is:",
options:[
["3",false],
["4",false],
["1",false],
["2",true]
]
},

{
q:"What is the output of the following code?",
code:"SI = 1001001110101101, CF = 0\nSHR SI, 1",
options:[
["SI=19820, CF=1",false],
["SI=53708, CF=1",false],
["SI=18902, CF=1",true],
["SI=37805, CF=1",false]
]
},

{
q:"In 8255, if you want to output data to a 7-segment display through Port B, which control word configures Port B as output (Mode 0)?",
options:[
["10010000B",true],
["10000001B",false],
["10000010B",false],
["10000000B",false]
]
},

{
q:"What is the output of the following code?",
code:"BX = 23763, CL = 8\nROL BX, CL",
options:[
["BX=0110100100111101, CF=1",false],
["BX=1011100110001100, CF=1",false],
["BX=1101001101011100, CF=0",true],
["BX=0101110011010011, CF=0",false]
]
}

];

let currentQuestions = [];
let submitted = false;

function shuffle(array) {
    let arr = [...array];

    for (let i = arr.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
}

function startQuiz() {

    submitted = false;

    currentQuestions = shuffle(questions).map(q => ({
        ...q,
        options: shuffle(q.options)
    }));

    document.getElementById("quiz").innerHTML = "";
    document.getElementById("result").style.display = "none";
    document.getElementById("submitBtn").style.display = "block";

    renderQuestions();
    updateProgress();

    window.scrollTo(0, 0);
}

function renderQuestions() {

    const quiz = document.getElementById("quiz");

    currentQuestions.forEach((q, index) => {

        let html = `
        <div class="question" id="question${index}">
            <h3>Q${index + 1}. ${q.q}</h3>
        `;

        if (q.code) {
            html += `<div class="code">${q.code}</div>`;
        }

        q.options.forEach((opt, optIndex) => {

            const letter = String.fromCharCode(97 + optIndex);

            html += `
            <label class="option" id="option${index}_${optIndex}">
                <input type="radio"
                    name="q${index}"
                    value="${optIndex}"
                    onchange="updateProgress()">
                <b>${letter})</b> ${opt[0]}
            </label>
            `;
        });

        html += `<div class="explanation" id="explanation${index}"></div>`;
        html += `</div>`;

        quiz.innerHTML += html;
    });
}

function updateProgress() {

    let count = 0;

    currentQuestions.forEach((q, index) => {
        if (document.querySelector(`input[name="q${index}"]:checked`)) {
            count++;
        }
    });

    document.getElementById("answered").innerText =
        `Answered: ${count}/20`;

    document.getElementById("progressBar").style.width =
        (count / 20 * 100) + "%";
}

function submitQuiz() {

    if (submitted) return;

    if (!confirm("Are you sure you want to submit the test?")) {
        return;
    }

    submitted = true;

    let correct = 0;
    let wrong = 0;
    let blank = 0;

    currentQuestions.forEach((q, index) => {

        const selected = document.querySelector(
            `input[name="q${index}"]:checked`
        );

        const correctIndexes = [];

        q.options.forEach((opt, i) => {
            if (opt[1]) correctIndexes.push(i);
        });

        q.options.forEach((opt, i) => {

            const label = document.getElementById(
                `option${index}_${i}`
            );

            const radio = label.querySelector("input");
            radio.disabled = true;

            if (opt[1]) {
                label.classList.add("correct");
            }

            if (selected && Number(selected.value) === i && !opt[1]) {
                label.classList.add("wrong");
            }
        });

        const explanation = document.getElementById(
            `explanation${index}`
        );

        if (!selected) {

            blank++;

            explanation.innerHTML =
                '<span class="red">Not Answered</span>';

        } else if (correctIndexes.includes(Number(selected.value))) {

            correct++;

            explanation.innerHTML =
                '<span class="green">✓ Correct Answer</span>';

        } else {

            wrong++;

            explanation.innerHTML =
                '<span class="red">✗ Wrong Answer</span>';
        }

        const correctText = correctIndexes.map(i => {
            return String.fromCharCode(97 + i) + ") " + q.options[i][0];
        }).join(" / ");

        explanation.innerHTML +=
            `<br><span class="green">Correct: ${correctText}</span>`;
    });

    const marks = correct - (wrong * 0.5);
    const percentage = (correct / 20 * 100);

    document.getElementById("correctCount").innerText = correct;
    document.getElementById("wrongCount").innerText = wrong;
    document.getElementById("blankCount").innerText = blank;

    document.getElementById("finalScore").innerText =
        marks.toFixed(2) + " / 20";

    document.getElementById("percentage").innerText =
        percentage.toFixed(1) + "%";

    let grade = "";

    if (marks >= 16) grade = "Excellent Performance!";
    else if (marks >= 12) grade = "Good Performance!";
    else if (marks >= 8) grade = "Keep Practicing!";
    else grade = "Need More Practice!";

    document.getElementById("grade").innerText = grade;

    document.getElementById("submitBtn").style.display = "none";
    document.getElementById("result").style.display = "block";

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}

// Start first test
startQuiz();

</script>
</body>
</html>
